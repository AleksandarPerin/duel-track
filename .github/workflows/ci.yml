name: CI

on:
  push:
    branches: ['**'] # not tags
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes a running check, except on main,
# where every commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # Same images as docker-compose.yml. The integration tests create and
    # migrate the dueltrack_test database themselves (test/globalSetup.ts).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dueltrack
          POSTGRES_PASSWORD: dueltrack_ci
          POSTGRES_DB: dueltrack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U dueltrack -d dueltrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://dueltrack:dueltrack_ci@localhost:5432/dueltrack_test
      TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage # fails if coverage drops below the floors
